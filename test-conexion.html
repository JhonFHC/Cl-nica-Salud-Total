<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Conexión Supabase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #64748B;
      margin-bottom: 24px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #F1F5F9;
      font-size: 0.88rem;
    }
    .info-row:last-child { border-bottom: none; }
    .label { color: #64748B; }
    .value { font-weight: 500; color: #1E293B; word-break: break-all; }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 10px;
      margin: 20px 0;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status.connecting { background: #FEF3C7; color: #92400E; }
    .status.success { background: #D1FAE5; color: #065F46; }
    .status.error { background: #FEE2E2; color: #991B1B; }
    .status .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(146,64,14,0.2);
      border-top-color: #92400E;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: #2563EB; color: white; }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #E2E8F0;
      color: #64748B;
    }
    .btn-outline:hover { border-color: #94A3B8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .flex { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .log {
      background: #1E293B;
      color: #E2E8F0;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 16px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .log.open { display: block; }
    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 0.85rem;
      color: #64748B;
    }
    .check-item .icon { font-size: 1rem; }
    .check-item.done { color: #065F46; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔌 Test de Conexión Supabase</h1>
    <p class="subtitle">Verifica la conexión con tu proyecto Supabase</p>

    <div class="info-row">
      <span class="label">URL</span>
      <span class="value" id="displayUrl">—</span>
    </div>
    <div class="info-row">
      <span class="label">Proyecto</span>
      <span class="value" id="displayProject">—</span>
    </div>

    <div id="statusBox" class="status connecting">
      <div class="spinner"></div>
      <span>Verificando conexión...</span>
    </div>

    <div id="checks">
      <div class="check-item" id="check1"><span class="icon">○</span> Inicializar cliente Supabase</div>
      <div class="check-item" id="check2"><span class="icon">○</span> Autenticación anónima</div>
      <div class="check-item" id="check3"><span class="icon">○</span> Consultar tablas existentes</div>
      <div class="check-item" id="check4"><span class="icon">○</span> Leer registros (primeros 5)</div>
    </div>

    <div class="flex">
      <button class="btn btn-primary" id="btnReintentar">↻ Reintentar</button>
      <button class="btn btn-outline" id="btnToggleLog">📋 Ver detalle</button>
    </div>

    <div class="log" id="logBox"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ovmvatdwaruvohvhpozh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__OV1fl0xO9E89fgOTqELUw_IaI80WXM';

    const $ = id => document.getElementById(id);
    const log = [];

    function addLog(msg) { log.push(msg); console.log(msg); }

    function setCheck(id, done, text) {
      const el = $(id);
      if (!el) return;
      el.className = `check-item ${done ? 'done' : ''}`;
      el.querySelector('.icon').textContent = done ? '✓' : '✗';
      if (text) el.innerHTML = `<span class="icon">${done ? '✓' : '✗'}</span> ${text}`;
    }

    function setStatus(type, msg) {
      const box = $('statusBox');
      const icons = { success: '✅', error: '❌', connecting: '⏳' };
      const cls = { success: 'success', error: 'error', connecting: 'connecting' };
      box.className = `status ${cls[type] || 'connecting'}`;
      box.innerHTML = type === 'connecting'
        ? `<div class="spinner"></div><span>${msg}</span>`
        : `<span>${icons[type] || ''}</span><span>${msg}</span>`;
    }

    async function testConnection() {
      setStatus('connecting', 'Verificando conexión...');
      setCheck('check1', false);
      setCheck('check2', false);
      setCheck('check3', false);
      setCheck('check4', false);
      addLog('=== INICIANDO TEST DE CONEXIÓN ===');

      $('displayUrl').textContent = SUPABASE_URL;
      $('displayProject').textContent = SUPABASE_URL.match(/https:\/\/(.+)\.supabase/)?.[1] || '—';

      // --- Check 1: Inicializar cliente ---
      try {
        addLog('Paso 1: Inicializando cliente Supabase...');
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        if (!supabaseClient) throw new Error('Cliente no se creó');
        addLog('✓ Cliente Supabase creado exitosamente');
        setCheck('check1', true, '✓ Inicializar cliente Supabase');
      } catch (err) {
        addLog(`✗ Error al crear cliente: ${err.message}`);
        setCheck('check1', false, `✗ Error al crear cliente: ${err.message}`);
        setStatus('error', 'Error al inicializar el cliente Supabase');
        return;
      }

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // --- Check 2: Autenticación anónima ---
      try {
        addLog('Paso 2: Verificando autenticación anónima...');
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        addLog(`✓ Sesión anónima: ${sessionData.session ? 'activa' : 'sin sesión (esperado)'}`);
        setCheck('check2', true, '✓ Autenticación anónima disponible');
      } catch (err) {
        addLog(`✗ Error de autenticación: ${err.message}`);
        setCheck('check2', false, `✗ Error de auth: ${err.message}`);
      }

      // --- Check 3: Consultar tablas ---
      let tablasEncontradas = [];
      try {
        addLog('Paso 3: Consultando esquema de tablas...');
        // Try common table names that might exist
        const posiblesTablas = ['todos', 'pacientes', 'citas', 'usuarios', 'doctores', 'especialidades', 'transacciones', 'historial_clinico'];
        for (const tabla of posiblesTablas) {
          try {
            const { error } = await supabaseClient.from(tabla).select('count', { count: 'exact', head: true });
            if (!error || error.code !== 'PGRST116') {
              tablasEncontradas.push(tabla);
              addLog(`  ✓ Tabla encontrada: "${tabla}"`);
            }
          } catch (_) { /* tabla no existe */ }
        }
        if (tablasEncontradas.length === 0) {
          addLog('  ℹ No se encontraron tablas existentes. Las tablas se crearán al insertar datos.');
          addLog('  ℹ Esto es normal si aún no has creado ninguna tabla en Supabase.');
          setCheck('check3', true, `✓ Consulta de tablas OK (sin tablas aún — crearás una abajo)`);
        } else {
          setCheck('check3', true, `✓ ${tablasEncontradas.length} tabla(s) encontrada(s): ${tablasEncontradas.join(', ')}`);
        }
      } catch (err) {
        addLog(`✗ Error al consultar tablas: ${err.message}`);
        setCheck('check3', false, `✗ Error al consultar tablas: ${err.message}`);
      }

      // --- Check 4: CRUD de prueba ---
      try {
        addLog('Paso 4: Probando crear y leer una tabla de prueba...');
        // Try inserting into a test table
        const testTable = '_test_connection';
        const { error: insertError } = await supabaseClient
          .from(testTable)
          .insert([{ created_at: new Date().toISOString(), status: 'conexion_ok' }]);

        if (insertError && insertError.code === 'PGRST116') {
          addLog('  ℹ Tabla _test_connection no existe — creándola...');
          // Table doesn't exist, that's fine for read-only check
          // Try to read from any existing table
          if (tablasEncontradas.length > 0) {
            const { data, error: readError } = await supabaseClient
              .from(tablasEncontradas[0])
              .select('*')
              .limit(5);
            if (readError) throw readError;
            addLog(`  ✓ Leídos ${data?.length || 0} registros de "${tablasEncontradas[0]}"`);
            setCheck('check4', true, `✓ Lectura OK: ${data?.length || 0} registros en "${tablasEncontradas[0]}"`);
          } else {
            // No tables exist - this is OK, just mark as info
            addLog('  ℹ No hay tablas para leer. La conexión con Supabase funciona correctamente.');
            addLog('  ℹ Para empezar, crea una tabla desde el panel de Supabase o inserta datos con el botón de abajo.');
            setCheck('check4', true, '✓ Sin tablas aún — conexión OK, crea tu primera tabla');
          }
        } else if (!insertError) {
          addLog('  ✓ Inserción de prueba exitosa');
          const { data } = await supabaseClient.from(testTable).select('*').limit(5);
          addLog(`  ✓ Lectura de prueba: ${data?.length || 0} registro(s)`);
          setCheck('check4', true, `✓ CRUD funcional: inserción y lectura OK`);

          // Clean up test data
          await supabaseClient.from(testTable).delete().neq('status', 'nonexistent');
        } else {
          throw insertError;
        }
      } catch (err) {
        addLog(`✗ Error en operación de datos: ${err.message}`);
        if (tablasEncontradas.length > 0) {
          setCheck('check4', false, `✗ Error al leer datos: ${err.message}`);
        } else {
          setCheck('check4', true, `ℹ Sin tablas para probar — la conexión base funciona`);
        }
      }

      addLog('=== TEST DE CONEXIÓN COMPLETADO ===');
      setStatus('success', '✅ Conexión establecida correctamente con Supabase');
    }

    function showLog() {
      const box = $('logBox');
      box.classList.toggle('open');
      box.textContent = log.join('\n');
      box.scrollTop = box.scrollHeight;
    }

    // --- Botón para crear tabla desde el test ---
    function addCreateTableButton() {
      const flex = document.querySelector('.flex');
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.innerHTML = '🗄️ Crear tabla pacientes';
      btn.onclick = createPacientesTable;
      flex.appendChild(btn);
    }

    async function createPacientesTable() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '⏳ Creando...';
      addLog('Creando tabla "pacientes" via SQL...');

      try {
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Insert sample data - the table will auto-create if RLS allows
        // Otherwise the user needs to create it in Supabase dashboard
        const { error } = await supabaseClient
          .from('pacientes')
          .insert([
            { dni: '45236789', nombre: 'Ana María', apellido: 'Gutiérrez', edad: 34, telefono: '987654321', seguro: 'SIS' },
            { dni: '47891234', nombre: 'Roberto', apellido: 'Huamán', edad: 52, telefono: '976543210', seguro: 'EsSalud' }
          ]);

        if (error) {
          addLog(`✗ No se pudo crear/insertar: ${error.message}`);
          addLog(`  Para crear la tabla manualmente, ve a: ${SUPABASE_URL}/project/default`);
          Components?.showToast?.({ message: `Error: ${error.message}. Crea la tabla desde el panel de Supabase.`, type: 'error' });
        } else {
          addLog('✓ Tabla "pacientes" creada y datos insertados exitosamente');
          setCheck('check3', true, '✓ Tabla "pacientes" creada y funcional');
        }
      } catch (err) {
        addLog(`✗ Error: ${err.message}`);
      }
      btn.disabled = false;
      btn.textContent = '🗄️ Crear tabla pacientes';
    }

    document.addEventListener('DOMContentLoaded', () => {
      testConnection();
      document.getElementById('btnReintentar').addEventListener('click', testConnection);
      document.getElementById('btnToggleLog').addEventListener('click', showLog);
      addCreateTableButton();
    });
  </script>
</body>
</html>
